[project]
name = "paper-organizer"
version = "0.1.0"
description = "AI-powered research paper classification for Obsidian."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.24.1",
    "pypdf>=5.0",
    "anthropic>=0.42",
    "pyyaml>=6.0",
]

[project.scripts]
paper-organizer = "paper_organizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_organizer"]
